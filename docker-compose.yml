version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: deadtime_postgres
    environment:
      POSTGRES_USER: deadtime
      POSTGRES_PASSWORD: deadtime_password
      POSTGRES_DB: deadtime_b2b
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
