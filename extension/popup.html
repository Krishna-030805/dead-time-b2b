<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <div class="logo">DT</div>
    <div>
      <div class="title">Dead Time Recorder</div>
      <div class="subtitle">Workflow Intelligence Engine</div>
    </div>
  </div>

  <div class="status-box">
    <div class="status-row">
      <span>Backend:</span>
      <span id="backend-status" class="status-badge offline">Checking...</span>
    </div>
    <div class="status-row">
      <span>Telemetry:</span>
      <span id="telemetry-status" class="status-badge online">Active</span>
    </div>
  </div>

  <div class="config-box" style="margin-bottom: 8px;">
    <button id="btn-toggle-telemetry" class="btn" style="width: 100%; font-size: 0.78rem; padding: 6px; cursor: pointer; border-radius: 4px; border: 1px solid #4f46e5; background: #312e81; color: #fff;">
      ⏸️ Pause Telemetry (Private Mode)
    </button>
  </div>

  <div class="config-box">
    <div class="config-label">Client Company / Org ID</div>
    <div class="config-row" style="margin-bottom: 8px;">
      <input type="text" id="org-id-input" placeholder="e.g. acme_corp" spellcheck="false" />
    </div>
    <div class="config-label">Employee Seat Identifier</div>
    <div class="config-row">
      <input type="text" id="user-id-input" placeholder="e.g. seat_01" spellcheck="false" />
      <button id="btn-save-user" class="btn-save">Set</button>
    </div>
    <div id="save-msg" class="save-msg"></div>
  </div>

  <div class="privacy-notice" style="font-size: 0.68rem; color: #94a3b8; line-height: 1.35; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 4px; margin-bottom: 10px; border-left: 2px solid #10b981;">
    <strong>Privacy Design:</strong> Records app tokens &amp; timestamps only. Never logs keystrokes, form inputs, passwords, or personal screens.
  </div>

  <div class="actions">
    <button id="btn-dashboard" class="btn primary">Open Audit Console</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
